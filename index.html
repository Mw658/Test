<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello · clean HTML</title>
  <style>
    /* Reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(145deg, #f9fafc 0%, #eef1f7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #1a2639;
    }

    /* Card container */
    .card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 2.5rem;
      box-shadow: 
        0 25px 40px -12px rgba(0, 20, 30, 0.25),
        inset 0 0 0 1px rgba(255, 255, 255, 0.7);
      padding: 3rem 2.5rem;
      max-width: 36rem;
      width: 100%;
      text-align: center;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: scale(1.01);
    }

    /* Decorative accent */
    .accent-dot {
      display: inline-block;
      width: 0.75rem;
      height: 0.75rem;
      background: #3b82f6;
      border-radius: 50%;
      margin-right: 0.5rem;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    h1 {
      font-size: clamp(2.2rem, 8vw, 3.8rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.25rem 0.75rem;
    }

    .gradient-text {
      background: linear-gradient(135deg, #1e293b, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      padding-right: 0.1em;
    }

    /* small subline */
    .sub {
      font-size: 1.2rem;
      color: #475569;
      border-top: 1px solid rgba(100, 116, 139, 0.2);
      padding-top: 1.5rem;
      margin-top: 0.75rem;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    code {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
      background: #e2e8f0;
      padding: 0.3rem 0.9rem;
      border-radius: 40px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #1e293b;
      letter-spacing: -0.01em;
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
    }

    /* tiny badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #ffffffd8;
      border: 1px solid #cbd5e1;
      border-radius: 40px;
      padding: 0.4rem 1.2rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: #334155;
      margin-bottom: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      letter-spacing: 0.3px;
      backdrop-filter: blur(4px);
    }

    .badge svg {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      fill: #3b82f6;
    }

    /* animation */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .float-icon {
      animation: float 3.5s ease-in-out infinite;
      display: inline-block;
      margin-right: 0.3rem;
    }

    /* footer / meta */
    .meta {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 2rem;
      opacity: 0.8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .meta span {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- mini badge for style -->
    <div class="badge">
      <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm9 2.5v-1H7v1h2Zm0-2.5V4h-2v4h2Z"/>
      </svg>
      pure html · css
    </div>

    <h1>
      <span class="float-icon">✨</span>
      <span class="gradient-text">Hello, world!</span>
      <span class="accent-dot" aria-hidden="true"></span>
    </h1>

    <div class="sub">
      <code>&lt;html&gt;</code>
      <span style="font-size: 1rem; color: #94a3b8;">•</span>
      <code>&lt;body&gt;</code>
      <span style="font-size: 1rem; color: #94a3b8;">•</span>
      <code>&lt;h1&gt;</code>
    </div>

    <div class="meta">
      <span>⚡ static</span>
      <span>🎯 accessible</span>
      <span>📱 responsive</span>
    </div>
  </div>
</body>
</html>
